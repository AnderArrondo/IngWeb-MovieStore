{%extends 'base.html'%}

{% load static %}
{% block extra_head %}
    <link rel = "stylesheet" href="{% static 'css/directores.css' %}">
{% endblock %}

{% block main_content%}

    <section class="directores">

        <h2> DIRECTORES</h2>

        {% if direcores %}

            <div class="directores-container">

                {% for director in directores %}

                    <article class="director-card">

                        <a href="{% url 'director_detalles' director.nombre_completo %}">
                            <img src="">
                            <h3> {{director.nombre_completo}} </h3>
                            <p> {{director.pais}} </p>
                            <p> {{director.nacimiento}} </p>
                        </a>

                    </article>
                
                {% endfor %}

            </div>

        {% endif %}

    </section>

{% endblock %}
