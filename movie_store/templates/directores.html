{%extends 'base.html'%}

{% block main_content%}

    <h1> DIRECTORES </h1>

    {% if directores %}
        <div class="contenedor">

            {% for director in directores %}
             
                <div class="cuadro">

                    <div class="imagen">

                    </div>

                    <div class="nombre">

                        <a href="{% url 'director_detalles' director %}">{{ director }} </a>

                    </div>

                </div>
        
            {% endfor %}

        </div>

    {% else %}

        <p> No se hay directores que mostrar.</p>
  
    {% endif %}

{% endblock %}
